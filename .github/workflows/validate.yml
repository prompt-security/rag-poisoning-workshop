name: Validate deck build (PR)

# Proves the deck still builds and exports on every PR.
#
# Installs with `npm ci`, so it builds exactly what the committed lockfile pins — the same thing
# pages.yml and release.yml ship. This job executes code from the PR's own checkout, so a fresh
# `npm install` here would let a PR that edits package.json pull arbitrary packages and run their
# install scripts in CI. If you need to regenerate the lockfile, do it locally and commit it.
on:
  pull_request:
    paths:
      - 'workshop/slides/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshop/slides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workshop/slides/package-lock.json

      - name: Install deps (locked)
        run: npm ci

      - name: Build Slidev (static site)
        run: npx slidev build --base / --out dist

      - name: Install Chromium for export
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx

      - name: Install agg + ensure ffmpeg
        run: |
          # Pinned to the commit v1.5.0 pointed at; a git tag is mutable.
          cargo install --git https://github.com/asciinema/agg --rev 5592b9790ba7c6d5ffa232176e29a1d3cadf8fe2
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Export PDF
        run: npx slidev export --format pdf --output deck.pdf

      - name: Export PPTX + embed videos
        run: |
          set -euo pipefail
          bash scripts/make-videos.sh build/vid
          npx slidev export --format pptx --no-with-clicks
          HP="$(node scripts/find-video-slides.mjs hidden_parrot_rec)"
          PF="$(node scripts/find-video-slides.mjs ps_fuzz_rec)"
          echo "video slides: HP=$HP PF=$PF"
          python scripts/embed_pptx_videos.py slides-export.pptx \
            "$HP:build/vid/hidden_parrot_rec.mp4:build/vid/hidden_parrot_rec.poster.png" \
            "$PF:build/vid/ps_fuzz_rec.mp4:build/vid/ps_fuzz_rec.poster.png"
          mv slides-export.pptx deck.pptx

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deck-preview
          path: |
            workshop/slides/deck.pdf
            workshop/slides/deck.pptx
          if-no-files-found: error
