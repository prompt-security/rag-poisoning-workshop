name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'workshop/slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow this workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshop/slides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workshop/slides/package-lock.json

      - run: npm ci

      # Resolve the correct base path FIRST: '/' for the access-controlled *.pages.github.io
      # domain used by private/internal repos, or '/<repo>/' for a public project site.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Slidev
        run: npx slidev build --base "${{ steps.pages.outputs.base_path }}" --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: workshop/slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
